name: iOS build check

# Unsigned iOS Simulator build of the app and its widget extension.
# Verifies that every trimming step still compiles; no signing, no secrets.

on:
  push:
    branches: [ios-minimal]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Local signing config (empty team, unsigned)
        run: printf 'DEVELOPMENT_TEAM =\n' > Config.local.xcconfig

      - name: Build (iOS Simulator)
        run: |
          mkdir -p build
          xcodebuild build \
            -project AIMeter.xcodeproj \
            -scheme AIMeter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E '(error|warning: unre|BUILD (SUCCEEDED|FAILED))' || true
          grep -q 'BUILD SUCCEEDED' build/xcodebuild.log

      - name: Error summary
        if: failure()
        run: |
          grep -E ' error: ' build/xcodebuild.log | sort -u | head -n 80 || true
